[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "srag-poc"
version = "2.0.0"
description = "PoC modular para monitoramento epidemiológico de SRAG com agente com tool calling real"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1,<3",
  "matplotlib>=3.8,<4",
  "langchain-core>=0.3,<2",
  "langchain-google-genai>=2,<4",
  "langgraph>=0.2,<2",
  "ddgs>=9,<10",
  "pypdf>=4,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
srag-poc = "srag_poc.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
